[package]
name = "shinjuku"
version = "0.3.0"
description = "An isometric twin-stick zombie shooter set in Tokyo train stations"
repository = "https://github.com/Bananalorian/shinjuku"
edition = "2024"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }

# native gamepads (the web build reads the browser Gamepad API through a tiny JS plugin)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
gilrs = "0.11"

[profile.dev.package.'*']
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
